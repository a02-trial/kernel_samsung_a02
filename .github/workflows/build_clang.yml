name: Build RooXie Kernel (AOSP Clang A10)

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'Nama HP (Contoh: SM-A022F)'
        required: true
        default: 'SM-A022F'

jobs:
  building-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libssl-dev libfl-dev curl git wget zip ccache libarchive-tools
          
      - name: Download Toolchain (Android 10 Version)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Download Clang r353983c (Standar Android 10)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-release/clang-r353983c.tar.gz
          tar -xf clang-r353983c.tar.gz
          
          # GCC 4.9 Tetap Pake LineageOS (Paling Stabil)
          git clone --depth 1 https://github.com/lineageos/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm
          git clone --depth 1 https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          cd ..

      - name: Start Building Kernel
        run: |
          # Setup Path Toolchain
          CLANG_PATH="${{ github.workspace }}/toolchain/bin"
          GCC64_PATH="${{ github.workspace }}/toolchain/gcc-aarch64/bin"
          GCC32_PATH="${{ github.workspace }}/toolchain/gcc-arm/bin"
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          
          # Identity
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="${{ github.event.inputs.DEVICE_NAME }}"
          
          # Opsi Build
          export OPTS="ARCH=arm \
                       O=out \
                       CC=clang \
                       CLANG_TRIPLE=arm-linux-gnueabi- \
                       CROSS_COMPILE=arm-linux-androideabi- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                       LD=ld.lld \
                       AR=llvm-ar \
                       NM=llvm-nm \
                       OBJCOPY=llvm-objcopy \
                       OBJDUMP=llvm-objdump \
                       STRIP=llvm-strip"

          # 1. Generate Config
          make $OPTS a02_defconfig
          
          # 2. Hajar Build
          make -j$(nproc --all) $OPTS zImage-dtb 2>&1 | tee build.log

      - name: Set Properties
        id: props
        run: echo "date=$(TZ=Asia/Jakarta date +%Y%m%d-%I%M%p)" >> $GITHUB_OUTPUT

      - name: Make Artifact & Zip
        run: |
          # Bikin folder penampungan
          mkdir -p ${{ github.workspace }}/final_output
          
          # COPY file mentahan pake -L (Follow Symlink)
          if [ -f "out/arch/arm/boot/zImage-dtb" ]; then
            cp -L out/arch/arm/boot/zImage-dtb ${{ github.workspace }}/final_output/zImage-dtb
          else
            echo "❌ zImage-dtb GAK NEMU!"
            exit 1
          fi
          
          cd ${{ github.workspace }}/final_output
          export DEVICE_NAME=${{ github.event.inputs.DEVICE_NAME }}
          export DATE_STR=${{ steps.props.outputs.date }}
          
          # Packing
          zip -9 ${DEVICE_NAME}-${DATE_STR}.zip zImage-dtb
          
          # Debug isi zip
          unzip -l ${DEVICE_NAME}-${DATE_STR}.zip
          
          # Pindah ke root
          cp *.zip ${{ github.workspace }}/

      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "${{ github.workspace }}/*.zip"
          name: RooXie Kernel ${{ github.event.inputs.DEVICE_NAME }} - ${{ steps.props.outputs.date }}
          tag: ${{ github.run_id }}-${{ steps.props.outputs.date }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Build Details
            - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
            - **Compiler**: AOSP Clang A10 (r353983c)
            - **Status**: Stable Build for Android 10/11
