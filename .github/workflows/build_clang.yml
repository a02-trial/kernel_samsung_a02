name: Build RooXie Kernel (AOSP Clang)

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'Nama HP (Contoh: SM-A022F)'
        required: true
        default: 'SM-A022F'

jobs:
  building-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libssl-dev libfl-dev curl git wget zip ccache libarchive-tools
          
      - name: Download AOSP Clang & GCC 4.9
        run: |
          mkdir -p toolchain
          cd toolchain
          # Clang 11 - Standar Android 11 (r383902)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz
          
          # GCC 4.9 buat pendamping (Cross Compile ARM32/64)
          git clone --depth 1 https://github.com/lineageos/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm
          git clone --depth 1 https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          cd ..

      - name: Start Building Kernel
        run: |
          # Setup Path Toolchain
          CLANG_PATH="${{ github.workspace }}/toolchain/bin"
          GCC64_PATH="${{ github.workspace }}/toolchain/gcc-aarch64/bin"
          GCC32_PATH="${{ github.workspace }}/toolchain/gcc-arm/bin"
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          
          # Identity
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="${{ github.event.inputs.DEVICE_NAME }}"
          
          # Opsi Build Spesifik MediaTek A02
          # Pakai LD=ld.lld buat hindarin error .relr.dyn tadi
          export OPTS="ARCH=arm \
                       O=out \
                       CC=clang \
                       CLANG_TRIPLE=arm-linux-gnueabi- \
                       CROSS_COMPILE=arm-linux-androideabi- \
                       CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                       LD=ld.lld \
                       AR=llvm-ar \
                       NM=llvm-nm \
                       OBJCOPY=llvm-objcopy \
                       OBJDUMP=llvm-objdump \
                       STRIP=llvm-strip"

          # 1. Generate Config (Ganti a02_defconfig sesuai nama di arch/arm/configs/)
          make $OPTS a02_defconfig
          
          # 2. Hajar Build
          make -j$(nproc --all) $OPTS zImage-dtb 2>&1 | tee build.log

      - name: Set Properties
        id: props
        run: echo "date=$(TZ=Asia/Jakarta date +%Y%m%d-%I%M%p)" >> $GITHUB_OUTPUT

      - name: Debug & Verify Output
        run: |
          echo "--- Cek Folder Boot ---"
          ls -lh out/arch/arm/boot/ || echo "❌ Folder out gak nemu!"
          
          if [ -f "out/arch/arm/boot/zImage-dtb" ]; then
            SIZE=$(stat -c%s "out/arch/arm/boot/zImage-dtb")
            echo "✅ zImage-dtb READY! Size: $SIZE bytes"
            if [ "$SIZE" -lt 5000000 ]; then
               echo "❌ Error: File 0 byte atau terlalu kecil!"
               exit 1
            fi
          else
            echo "❌ ERROR: zImage-dtb GAK ADA!"
            exit 1
          fi

      - name: Make Zip
        run: |
          cd ${{ github.workspace }}/out/arch/arm/boot
          export DEVICE_NAME=${{ github.event.inputs.DEVICE_NAME }}
          export DATE_STR=${{ steps.props.outputs.date }}
          
          # Packing j-9 biar dapet kernelnya aja, gak usah bawa folder
          zip -j9 ${DEVICE_NAME}-${DATE_STR}.zip zImage-dtb
          cp *.zip ${{ github.workspace }}/

      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "${{ github.workspace }}/*.zip"
          name: RooXie Kernel ${{ github.event.inputs.DEVICE_NAME }} - ${{ steps.props.outputs.date }}
          tag: ${{ github.run_id }}-${{ steps.props.outputs.date }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Build Details
            - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
            - **Compiler**: AOSP Clang (r383902) + GCC 4.9
            - **Branch**: Android 11 / Binary 3 Sync
            - **Date**: ${{ steps.props.outputs.date }}
