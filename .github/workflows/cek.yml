name: Fix Reboot Bug - Auto Path Finder

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: coba_build

      - name: "Sikat Bug Reboot (Auto Find Mode)"
        run: |
          echo "===================================================="
          echo "MENCARI FILE DTSI & DTS SECARA OTOMATIS..."
          
          # 1. Cari path asli mt6739.dtsi (biar gak tebak-tebakan jalur lagi)
          TARGET_DTSI=$(find arch/arm/boot/dts -name "mt6739.dtsi" | head -n 1)
          
          if [ -z "$TARGET_DTSI" ]; then
            echo "ERROR: File mt6739.dtsi gak ketemu di arch/arm/boot/dts!"
            exit 1
          fi
          
          echo "DAPET! Filenya ada di: $TARGET_DTSI"

          # 2. Patch: Aktifkan WDT & Tambah Warm Reboot
          # Kita ganti status = "disabled" jadi "okay"
          # Terus kita tambahin mediatek,warm-reboot biar gak shutdown
          
          echo "Applying patch to $TARGET_DTSI..."
          
          # Pakai sed yang lebih pinter: cari blok watchdog, ganti statusnya
          sed -i '/wdt: watchdog@10007000 {/,/status = "disabled";/s/status = "disabled";/status = "okay";/' "$TARGET_DTSI"
          
          # Tambahin warm-reboot tepat di bawah status = "okay" biar afdol
          sed -i '/status = "okay";/a \		mediatek,warm-reboot;' "$TARGET_DTSI"

          # 3. Verifikasi (Biar loe liat sendiri hasilnya di log)
          echo "===================================================="
          echo "VERIFIKASI HASIL PATCH:"
          grep -A 6 "watchdog@10007000" "$TARGET_DTSI"
          echo "===================================================="

      - name: "Upload Patch Log"
        run: |
          find arch/arm/boot/dts -name "mt6739.dtsi" -exec grep -A 10 "watchdog@10007000" {} + > patch_result.txt
          
      - name: Archive Result
        uses: actions/upload-artifact@v4
        with:
          name: patched-dts-log
          path: patch_result.txt
