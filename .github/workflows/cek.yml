name: Inspect DTS Folder Structure

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  list_structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: coba_build # Sesuaikan dengan branch loe

      - name: Generate Folder Structure & Content
        run: |
          OUTPUT="dts_structure_report.txt"
          TARGET_PATH="arch/arm/boot/dts"

          echo "====================================================" > $OUTPUT
          echo "   DTS FOLDER STRUCTURE & CONTENT REPORT            " >> $OUTPUT
          echo "   Path: $TARGET_PATH                               " >> $OUTPUT
          echo "   Date: $(date)                                    " >> $OUTPUT
          echo "====================================================" >> $OUTPUT

          if [ -d "$TARGET_PATH" ]; then
            echo -e "\n[1] TREE VIEW (Daftar File & Folder):" >> $OUTPUT
            # Pakai find buat simulasi tree biar rapi
            find "$TARGET_PATH" -maxdepth 3 -not -path '*/.*' >> $OUTPUT

            echo -e "\n[2] FILE CONTENT (Preview Isi File):" >> $OUTPUT
            echo "----------------------------------------------------" >> $OUTPUT
            
            # Loop untuk ambil isi semua file .dts dan .dtsi di folder mediatek
            find "$TARGET_PATH/mediatek" -name "*.dts*" 2>/dev/null | while read -r file; do
              echo "FILE: $file" >> $OUTPUT
              echo "----------------------------------------------------" >> $OUTPUT
              cat "$file" >> $OUTPUT
              echo -e "\n--- END OF FILE ---\n" >> $OUTPUT
            done
          else
            echo "ERROR: Path $TARGET_PATH tidak ditemukan!" >> $OUTPUT
          fi

          # Tampilkan di log biar bisa langsung baca
          cat $OUTPUT

      - name: Upload Structure Report
        uses: actions/upload-artifact@v4
        with:
          name: dts-folder-structure
          path: dts_structure_report.txt
