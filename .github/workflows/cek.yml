name: Advanced DTS Scanner - Kernel A02

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch kernel yang mau di-scan'
        required: true
        default: 'coba_build'

jobs:
  analyze_dts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Power Search & Deep Analysis
        run: |
          REPORT="dts_analysis_report.txt"
          
          echo "====================================================" > $REPORT
          echo "       KERNEL DTS DEEP SCANNER - SAMSUNG A02        " >> $REPORT
          echo "====================================================" >> $REPORT
          echo "Branch  : ${{ github.event.inputs.branch_name }}" >> $REPORT
          echo "Runtime : $(date)" >> $REPORT
          echo "====================================================" >> $REPORT

          echo -e "\n[1] DTS TREE STRUCTURE" >> $REPORT
          find . -maxdepth 10 -name "*.dts*" | sort >> $REPORT || echo "No DTS files found" >> $REPORT

          echo -e "\n[2] TARGETED KEYWORD SEARCH" >> $REPORT
          KEYWORDS="reboot|restart|powerkey|watchdog|bootreason|warm_reset|pmic_reset|sec_reboot"
          # Tambahkan || true agar tidak exit code 1 jika keyword tidak ketemu
          grep -rnE -C 2 "$KEYWORDS" --include="*.dts" --include="*.dtsi" . >> $REPORT || echo "No keywords found." >> $REPORT

          echo -e "\n[3] ANALYZING PMIC & POWER NODES" >> $REPORT
          # Tambahkan || true di sini juga
          grep -rn "compatible = \"mediatek,mt6k" . --include="*.dtsi" >> $REPORT || true
          grep -rn "compatible = \"mediatek,pull-push-reset\"" . --include="*.dtsi" >> $REPORT || true

          echo -e "\n[4] MT6739 SPECIFIC CONFIGURATION" >> $REPORT
          # Pastikan find f dapet hasil sebelum masuk loop
          FILES=$(find . -name "mt6739.dts" -o -name "mt6739.dtsi")
          if [ -z "$FILES" ]; then
            echo "mt6739 dts/dtsi files not found." >> $REPORT
          else
            echo "$FILES" | while read -r file; do
              echo "--- Source: $file ---" >> $REPORT
              sed '/\/\*/,/\*\//d; /\/\//d' "$file" | grep -v '^[[:space:]]*$' | head -n 500 >> $REPORT || true
              echo -e "\n--- End of $file ---\n" >> $REPORT
            done
          fi

          cat $REPORT

      - name: Upload Deep Analysis Result
        uses: actions/upload-artifact@v4
        with:
          name: dts-pro-report
          path: dts_analysis_report.txt
