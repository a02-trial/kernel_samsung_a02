name: Advanced DTS Scanner - Kernel A02

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch kernel yang mau di-scan'
        required: true
        default: 'coba_build'

jobs:
  analyze_dts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: "Detector Bug Reboot (Samsung A02)"
        run: |
          REPORT="reboot_bug_report.txt"
          echo "====================================================" > $REPORT
          echo "       REBOOT BUG DETECTOR - TARGETED SCAN          " >> $REPORT
          echo "====================================================" >> $REPORT

          # 1. CEK PSCI (Power State Coordination Interface)
          echo -e "\n[!] MENCARI NODE PSCI (Penting buat SMC/HVC Reboot)" >> $REPORT
          grep -rnl "compatible = \"arm,psci" . --include="*.dts*" | xargs -I {} sh -c 'echo "--- File: {} ---"; sed -n "/psci {/,/};/p" {}' >> $REPORT || echo "Node PSCI tidak ditemukan!" >> $REPORT

          # 2. CEK WATCHDOG (MTK-WDT)
          echo -e "\n[!] MENCARI NODE WATCHDOG (Eksekutor Reset)" >> $REPORT
          grep -rnl "compatible = \"mediatek,.*-wdt\"" . --include="*.dts*" | xargs -I {} sh -c 'echo "--- File: {} ---"; sed -n "/wdt: watchdog@/,/};/p" {}' >> $REPORT || echo "Node Watchdog tidak ditemukan!" >> $REPORT

          # 3. CEK REBOOT MODE / RESET REASON
          echo -e "\n[!] MENCARI CONFIG REBOOT-MODE" >> $REPORT
          grep -rn "reboot-mode" . --include="*.dts*" -C 3 >> $REPORT || echo "Config reboot-mode tidak ditemukan." >> $REPORT

          # 4. CEK PMIC RESET (MT635x)
          echo -e "\n[!] MENCARI RESET-METHOD DI PMIC" >> $REPORT
          grep -rn "mediatek,.*-reset" . --include="*.dts*" -C 2 >> $REPORT || echo "Custom reset method tidak ditemukan." >> $REPORT

          echo -e "\n================ SCAN SELESAI ================" >> $REPORT
          cat $REPORT

      - name: Upload Deep Analysis Result
        uses: actions/upload-artifact@v4
        with:
          name: dts-pro-report
          path: dts_analysis_report.txt
